services:
  postgres:
    image: postgres:16
    container_name: seatrace-postgres
    environment:
      POSTGRES_DB: seatrace
      POSTGRES_USER: ${DB_NAME:-seatrace}
      POSTGRES_PASSWORD: ${DB_PW:-seatrace}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_NAME:-seatrace} -d seatrace"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: seatrace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SCOUTER_AGENT_VERSION: ${SCOUTER_AGENT_VERSION:-none}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/seatrace}
      SPRING_DATASOURCE_USERNAME: ${DB_NAME:-seatrace}
      SPRING_DATASOURCE_PASSWORD: ${DB_PW:-seatrace}
      REDIS_HOST: ${REDIS_HOST_DOCKER:-redis}
      REDIS_PORT: ${REDIS_PORT_DOCKER:-6379}
      REDIS_RESILIENCE_CIRCUIT_BREAKER_ENABLED: ${REDIS_RESILIENCE_CIRCUIT_BREAKER_ENABLED:-true}
      METRICS_TEST_CASE: ${METRICS_TEST_CASE:-default}
      EVENT_SEAT_CACHE_LOCAL_TTL_MS: ${EVENT_SEAT_CACHE_LOCAL_TTL_MS:-300000}
      EVENT_SEAT_CACHE_REDIS_TTL_SECONDS: ${EVENT_SEAT_CACHE_REDIS_TTL_SECONDS:-300}
      # Distributed lock (Redisson) toggle for A/B testing
      RESERVATION_LOCK_ENABLED: ${RESERVATION_LOCK_ENABLED:-true}
      RESERVATION_LOCK_WAIT_MS: ${RESERVATION_LOCK_WAIT_MS:-50}
      RESERVATION_LOCK_LEASE_MS: ${RESERVATION_LOCK_LEASE_MS:-3000}
      RESERVATION_LOCK_REQUIRED: ${RESERVATION_LOCK_REQUIRED:-false}
      # Virtual queue toggle (to isolate hold performance tests)
      VIRTUAL_QUEUE_ENABLED: ${VIRTUAL_QUEUE_ENABLED:-true}
      VIRTUAL_QUEUE_TPS: ${VIRTUAL_QUEUE_TPS:-500}
      VIRTUAL_QUEUE_ACTIVE_LIMIT: ${VIRTUAL_QUEUE_ACTIVE_LIMIT:-2000}
      VIRTUAL_QUEUE_ACTIVE_TTL_SECONDS: ${VIRTUAL_QUEUE_ACTIVE_TTL_SECONDS:-60}
      VIRTUAL_QUEUE_MAX_ADVANCE_PER_CALL: ${VIRTUAL_QUEUE_MAX_ADVANCE_PER_CALL:-50}
      VIRTUAL_QUEUE_ADVANCE_DELAY_MS: ${VIRTUAL_QUEUE_ADVANCE_DELAY_MS:-200}
      # Optional: Hikari pool debug logs
      LOG_LEVEL_HIKARI: ${LOG_LEVEL_HIKARI:-INFO}
      # Optional: enabled by running with docker compose --profile scouter and setting JAVA_TOOL_OPTIONS below.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:50000/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: seatrace-nginx
    command:
      - /bin/sh
      - -c
      - |
        app_replicas=$$(i=0; while [ $$i -lt 10 ]; do getent hosts app | cut -d' ' -f1; i=$$((i + 1)); done | sort -u | wc -l)
        echo "[nginx] discovered app replicas: $$app_replicas"
        exec nginx -g 'daemon off;'
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  k6:
    image: grafana/k6:0.50.0
    depends_on:
      - nginx
    volumes:
      - ./tools/k6:/scripts:ro
    entrypoint: ["k6"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: seatrace-prometheus
    depends_on:
      - app
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.4
    container_name: seatrace-grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
