<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SeatRace Signup</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <main class="auth-shell">
    <section class="auth-card card">
      <div class="auth-copy">
        <p class="eyebrow">SeatRace</p>
        <h1>회원가입</h1>
        <p class="lede">
          테스트 계정을 만든 뒤 로그인 페이지에서 JWT를 발급받을 수 있습니다.
        </p>
        <div class="auth-links">
          <a href="/">API Lab</a>
          <a id="loginLink" href="/login.html">로그인</a>
        </div>
      </div>

      <form id="signupForm" class="auth-form panel">
        <div class="status-card compact">
          <span class="status-label">Current User</span>
          <strong id="authState">미로그인</strong>
        </div>
        <label>
          이메일
          <input name="email" placeholder="user@example.com" autocomplete="email">
        </label>
        <label>
          이름
          <input name="name" placeholder="홍길동" autocomplete="name">
        </label>
        <label>
          비밀번호
          <input name="password" type="password" placeholder="비밀번호" autocomplete="new-password">
        </label>
        <button type="submit">회원가입</button>
        <p class="form-note">가입 성공 시 로그인 페이지로 이동할 수 있습니다.</p>
      </form>
    </section>
  </main>

  <script src="/auth.js"></script>
  <script src="/signup.js"></script>
</body>
</html>
