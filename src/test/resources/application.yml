spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:seatrace;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
jwt:
  secret: test-jwt-secret-which-is-256bits-long-enough
  expiration: 3600000
  issuer: seat-race-server
server:
  servlet:
    session:
      tracking-modes: cookie
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
