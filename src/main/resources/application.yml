spring:
  application:
    name: SeatRace
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seatrace}
    username: ${SPRING_DATASOURCE_USERNAME:seatrace}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  servlet:
    session:
      tracking-modes: cookie

jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-which-is-256bits-long}
  access-token-validity-in-ms: 3600000
  refresh-token-validity-in-ms: 1209600000
  issuer: "seat-race-server"

reservation:
  hold:
    ttl-seconds: 10
    cleanup-delay-ms: 3000
    stream-batch-size: 200
  lock:
    enabled: false
    wait-timeout-ms: 200
    lease-ms: 1000
    retry-delay-ms: 20
    max-retry: 10

virtual-queue:
  enabled: true
  tps: 500
  active-limit: 2000
  active-ttl-seconds: 60
  max-advance-per-call: 50

# --- 모니터링 설정 보강 시작 ---
management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 모든 HTTP 요청에 대해 P95, P99 계산을 위한 히스토그램 활성화
        http.server.requests: true
        seatrace_hold_stale_cleanup_duration_seconds: true
      percentiles:
        # 주요 구간 분위수 설정
        http.server.requests: 0.5, 0.75, 0.95, 0.99
      maximum-expected-value:
        http.server.requests: 10s
        seatrace_hold_stale_cleanup_duration_seconds: 10s
    enable:
      # JVM 상세 지표 활성화 (메모리, 쓰레드 등)
      jvm: true
# --- 모니터링 설정 보강 끝 ---

resilience4j:
  retry:
    instances:
      holdCleanup:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.dao.CannotAcquireLockException
          - org.springframework.dao.DeadlockLoserDataAccessException
          - org.springframework.dao.QueryTimeoutException
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.orm.ObjectOptimisticLockingFailureException
  circuitbreaker:
    instances:
      holdCleanup:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
