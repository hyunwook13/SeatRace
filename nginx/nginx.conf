worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker embedded DNS
  resolver 127.0.0.11 ipv6=off valid=10s;

  log_format upstream_timing
      '$remote_addr - $host [$time_local] request_id=$request_id "$request" status=$status '
      'upstream_status=$upstream_status upstream_addr=$upstream_addr '
      'upstream_response_time=$upstream_response_time request_time=$request_time '
      'referer="$http_referer" ua="$http_user_agent"';
  access_log /dev/stdout upstream_timing;
  error_log /dev/stderr notice;

  server {
    listen 80;

    location / {
      set $app_upstream app:8080;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Trace-Id $request_id;

      # Fail fast: don't let upstream stalls hang clients for 30s+
      proxy_send_timeout 3s;
      proxy_read_timeout 3s;
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;

      proxy_pass http://$app_upstream;
    }
  }
}
