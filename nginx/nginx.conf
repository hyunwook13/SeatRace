worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker embedded DNS
  resolver 127.0.0.11 ipv6=off valid=10s;

  upstream seatrace_app {
    zone seatrace_app 64k;
    # 부하 테스트 중 일시적 지연으로 upstream 전체가 down 처리되는 연쇄 502를 방지한다.
    server app:8080 resolve max_fails=0;
    keepalive 64;
  }

  server {
    listen 80;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Fail fast: don't let upstream stalls hang clients for 30s+
      proxy_send_timeout 3s;
      proxy_read_timeout 3s;
      proxy_connect_timeout 1s;

      proxy_pass http://seatrace_app;
    }
  }
}
